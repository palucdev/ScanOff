<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <!-- Background gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#0a2035"/>
      <stop offset="100%" stop-color="#060e18"/>
    </radialGradient>

    <!-- Cyan gradient for icons -->
    <linearGradient id="cyanGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5aeaea"/>
      <stop offset="100%" stop-color="#38c8d8"/>
    </linearGradient>

    <!-- Glow filter for cloud-slash -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Outer glow for scanner frame -->
    <filter id="outerGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="120" height="120" rx="18" fill="url(#bgGrad)"/>

  <!-- Cloud-slash2 icon: viewBox 0 0 16 16, scaled to 72px, centered at (24,24) -->
  <g transform="translate(30,30) scale(3.7)" filter="url(#glow)">
    <path fill-rule="evenodd"
      d="M3.112 5.112a3.125 3.125 0 0 0-.17.613C1.266 6.095 0 7.555 0 9.318 0 11.366 1.708 13 3.781 13H11l-1-1H3.781C2.231 12 1 10.785 1 9.318c0-1.365 1.064-2.513 2.46-2.666l.446-.05v-.447c0-.075.006-.152.018-.231l-.812-.812zm2.55-1.45-.725-.725A5.512 5.512 0 0 1 8 2c2.69 0 4.923 2 5.166 4.579C14.758 6.804 16 8.137 16 9.773a3.2 3.2 0 0 1-1.516 2.711l-.733-.733C14.498 11.378 15 10.626 15 9.773c0-1.216-1.02-2.228-2.313-2.228h-.5v-.5C12.188 4.825 10.328 3 8 3c-.875 0-1.678.26-2.339.661z"
      fill="url(#cyanGrad)"
    />
    <path
      d="m13.646 14.354-12-12 .708-.708 12 12-.707.707z"
      fill="url(#cyanGrad)"
    />
  </g>

  <!-- Scanner corners: viewBox 0 0 24 24, scaled to full 120px canvas -->
  <g transform="translate(0,0) scale(5)" filter="url(#outerGlow)">
    <!-- Bottom-left corner -->
    <path
      d="M9.25,19 L5,19 L5,14.75"
      stroke="url(#cyanGrad)"
      stroke-width="0.9"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"
    />
    <!-- Top-right corner -->
    <path
      d="M14.75,5 L19,5 L19,9.25"
      stroke="url(#cyanGrad)"
      stroke-width="0.9"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"
    />
    <!-- Top-left corner -->
    <path
      d="M9.25,5 L5,5 L5,9.25"
      stroke="url(#cyanGrad)"
      stroke-width="0.9"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"
    />
    <!-- Bottom-right corner -->
    <path
      d="M14.75,19 L19,19 L19,14.75"
      stroke="url(#cyanGrad)"
      stroke-width="0.9"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"
    />
  </g>
</svg>

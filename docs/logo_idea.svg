<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 788" width="1400" height="788">
  <defs>
    <!-- Background gradient (subtle radial from center) -->
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#0a2035"/>
      <stop offset="100%" stop-color="#060e18"/>
    </radialGradient>

    <!-- Document face gradient (cyan top to slightly darker bottom) -->
    <linearGradient id="docGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5aeaea"/>
      <stop offset="100%" stop-color="#38c8d8"/>
    </linearGradient>

    <!-- Folded corner gradient -->
    <linearGradient id="foldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3ab8c8"/>
      <stop offset="100%" stop-color="#2a98a8"/>
    </linearGradient>

    <!-- Scanner beam gradient (fades from bright cyan to transparent) -->
    <linearGradient id="beamGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#40d8e8" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#20a0c0" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0a3050" stop-opacity="0"/>
    </linearGradient>

    <!-- Left beam gradient -->
    <linearGradient id="beamLeftGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#30c0d8" stop-opacity="0.6"/>
      <stop offset="40%" stop-color="#1888a8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0a3050" stop-opacity="0"/>
    </linearGradient>

    <!-- Right beam gradient -->
    <linearGradient id="beamRightGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#30c0d8" stop-opacity="0.6"/>
      <stop offset="40%" stop-color="#1888a8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0a3050" stop-opacity="0"/>
    </linearGradient>

    <!-- Glow filter for the document -->
    <filter id="docGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Soft glow behind beams -->
    <filter id="beamGlow" x="-50%" y="-20%" width="200%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="12"/>
    </filter>

    <!-- Document shadow under fold -->
    <linearGradient id="docShadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2898b0"/>
      <stop offset="100%" stop-color="#30b8d0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1400" height="788" fill="url(#bgGrad)"/>

  <!-- === Scanner Beams (behind document) === -->
  <!-- Center x=695. Doc left=630, right=760. Beams symmetric around 695. -->
  <g>
    <!-- Ambient glow behind beams (full doc width top, symmetric bottom) -->
    <polygon points="630,385 540,680 850,680 760,385" fill="url(#beamGrad)" filter="url(#beamGlow)" opacity="0.5"/>

    <!-- Left beam: top [630,660], bottom [520,635] — mirror of right -->
    <polygon points="630,385 660,385 635,680 520,680" fill="url(#beamLeftGrad)"/>

    <!-- Center beam: top [660,730], bottom [590,800] — symmetric around 695 -->
    <polygon points="660,385 730,385 800,680 590,680" fill="url(#beamGrad)"/>

    <!-- Right beam: top [730,760], bottom [755,870] — mirror of left -->
    <polygon points="730,385 760,385 870,680 755,680" fill="url(#beamRightGrad)"/>
  </g>

  <!-- === Document Icon === -->
  <g filter="url(#docGlow)">
    <!-- Document body (rectangle with folded corner cut) -->
    <path d="M630,215 L730,215 L760,245 L760,385 L630,385 Z" fill="url(#docGrad)"/>

    <!-- Folded corner -->
    <path d="M730,215 L730,245 L760,245 Z" fill="url(#foldGrad)"/>

    <!-- Under-fold shadow sliver -->
    <path d="M730,215 L730,245 L760,245 Z" fill="#2a90a5" opacity="0.5"/>
  </g>

  <!-- === Text Lines on Document === -->
  <g>
    <rect x="655" y="255" width="72" height="8" rx="2" fill="#0e3848" opacity="0.7"/>
    <rect x="655" y="275" width="72" height="8" rx="2" fill="#0e3848" opacity="0.7"/>
    <rect x="655" y="295" width="72" height="8" rx="2" fill="#0e3848" opacity="0.7"/>
  </g>

  <!-- === Dark Scanner Triangle (V-shape on document) === -->
  <polygon points="655,330 745,330 700,385" fill="#0c2a3a" opacity="0.85"/>

  <!-- Subtle highlight edges on triangle -->
  <line x1="655" y1="330" x2="700" y2="385" stroke="#20809a" stroke-width="1" opacity="0.4"/>
  <line x1="745" y1="330" x2="700" y2="385" stroke="#20809a" stroke-width="1" opacity="0.4"/>
</svg>
